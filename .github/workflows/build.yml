name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Qt ${{ matrix.qt }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: 5
            packages: qtbase5-dev
            qmake: /usr/lib/qt5/bin/qmake
          - qt: 6
            packages: qt6-base-dev
            qmake: /usr/lib/qt6/bin/qmake

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.packages }}

      - name: Build the game
        run: |
          mkdir build && cd build
          ${{ matrix.qmake }} "QMAKE_CXXFLAGS+=-Wall -Wextra -Werror" ../TronCollection.pro
          make -j$(nproc)
          test -x TronCollection

      - name: Build and run the tests
        run: |
          mkdir build_tests && cd build_tests
          ${{ matrix.qmake }} ../tests/TronCollectionTest.pro
          make -j$(nproc)
          ./TronCollectionTest
